<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeritasAI — every claim deserves a trial</title>
<style>
  :root {
    --bg: #0e1013; --panel: #16191f; --panel-2: #1c2028; --line: #272c36;
    --ink: #e8e6e1; --muted: #8b93a1; --faint: #5b6373;
    --pro: #e0574f; --exp: #5b9bd5; --def: #4caf7d; --gold: #c9a227;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 96px; }

  header { text-align: center; padding: 28px 0 34px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--serif); font-size: 44px; margin: 0; letter-spacing: .5px; }
  h1 .ai { color: var(--gold); }
  .tag { color: var(--muted); font-style: italic; font-family: var(--serif); font-size: 17px; margin-top: 6px; }

  form { display: flex; gap: 10px; margin: 30px 0 14px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    padding: 15px 18px; border-radius: 8px; font-size: 16px; font-family: var(--serif);
  }
  input[type=text]:focus { outline: none; border-color: var(--gold); }
  button {
    background: var(--gold); color: #17140a; border: 0; padding: 0 26px; border-radius: 8px;
    font-weight: 700; font-size: 15px; cursor: pointer; letter-spacing: .3px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--faint); }

  /* docket / progress */
  .bench { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 22px 0; }
  .seat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; font-size: 13px; transition: border-color .2s, background .2s;
  }
  .seat .who { font-family: var(--serif); font-size: 15px; }
  .seat .model { color: var(--faint); font-family: var(--mono); font-size: 11px;
                 margin-top: 3px; word-break: break-all; }
  .seat .state { font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
                 color: var(--faint); margin-top: 7px; }
  .seat[data-state=running]   { border-color: var(--gold); }
  .seat[data-state=running] .state,
  .seat[data-state=repairing] .state { color: var(--gold); animation: pulse 1.1s infinite; }
  .seat[data-state=done]   { border-color: #2f4a3a; }
  .seat[data-state=done] .state { color: var(--def); }
  .seat[data-state=failed] { border-color: #4a2f2f; }
  .seat[data-state=failed] .state { color: var(--pro); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* verdict */
  .verdict {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-top: 3px solid var(--gold);
    border-radius: 10px; padding: 30px 32px; margin: 28px 0;
  }
  .label { font-family: var(--serif); font-size: 46px; line-height: 1.1; letter-spacing: 1px; }
  .meter { height: 9px; background: #23272f; border-radius: 999px; overflow: hidden; margin: 16px 0 8px; }
  .meter > i { display: block; height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .score-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .reason { font-family: var(--serif); font-size: 17px; margin-top: 20px; color: #d8d5cf; }

  .args { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .arg { background: #12151a; border-left: 3px solid var(--line); border-radius: 6px; padding: 13px 16px; }
  .arg h4 { margin: 0 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .arg.for  { border-left-color: var(--def); }
  .arg.agst { border-left-color: var(--pro); }

  /* briefs */
  .briefs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
  .brief { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: 9px; padding: 20px; }
  .brief.pro { border-top-color: var(--pro); } .brief.exp { border-top-color: var(--exp); }
  .brief.def { border-top-color: var(--def); }
  .brief h3 { font-family: var(--serif); margin: 0 0 2px; font-size: 20px; }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  .conf { font-family: var(--mono); font-size: 26px; margin: 12px 0 4px; }
  .brief.pro .conf { color: var(--pro); } .brief.exp .conf { color: var(--exp); }
  .brief.def .conf { color: var(--def); }
  .conf small { font-size: 11px; color: var(--faint); font-family: var(--sans); display: block; letter-spacing: .5px; }
  .headline { font-family: var(--serif); font-style: italic; color: #cfccc5; margin: 12px 0 16px; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint);
         margin: 18px 0 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  ul { margin: 0; padding-left: 18px; font-size: 14px; }
  li { margin-bottom: 8px; }
  .src { color: var(--faint); font-size: 12px; }
  .str { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-right: 5px; }

  .section-title { font-family: var(--serif); font-size: 15px; letter-spacing: 2.4px;
                   text-transform: uppercase; color: var(--muted); margin: 38px 0 14px; }
  .docket { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 20px 24px; }
  .docket .meta { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-bottom: 12px; }
  .docket li { font-family: var(--serif); font-size: 15px; }
  .nuance li { font-family: var(--serif); font-size: 15px; }

  .record { width: 100%; border-collapse: collapse; font-size: 12.5px; font-family: var(--mono); margin-top: 10px; }
  .record th { text-align: left; color: var(--faint); font-weight: 400; padding: 6px 10px;
               border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
  .record td { padding: 7px 10px; border-bottom: 1px solid #1b1f27; color: var(--muted); }
  .ok { color: var(--def); } .bad { color: var(--pro); }

  /* retrieved evidence */
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
             color: var(--faint); margin: 14px 0 8px; }
  .eyebrow:first-child { margin-top: 0; }
  .ev { margin-bottom: 10px; font-size: 14px; }
  .ev a { color: #9dc0e8; text-decoration: none; }
  .ev a:hover { text-decoration: underline; }
  .ev .meta { color: var(--faint); font-size: 12px; }

  /* citation audit */
  .audit { border-radius: 9px; padding: 20px 24px; border: 1px solid var(--line); background: var(--panel); }
  .audit.clean { border-left: 3px solid var(--def); }
  .audit.dirty { border-left: 3px solid var(--pro); }
  .audit.partial { border-left: 3px solid var(--gold); }
  .audit h4 { margin: 0 0 14px; font-size: 15px; font-family: var(--serif); }
  .cite { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #1b1f27; font-size: 13.5px; }
  .cite:first-of-type { border-top: 0; }
  .cite .mark { flex: 0 0 16px; font-family: var(--mono); }
  .cite .who { flex: 0 0 42px; color: var(--faint); font-size: 11px; text-transform: uppercase; padding-top: 2px; }
  .cite .body { flex: 1; }
  .cite .det { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .m-verified { color: var(--def); } .m-partial { color: var(--gold); }
  .m-unverified { color: var(--pro); font-weight: 700; }
  .m-unchecked { color: #b07fd0; } .m-journal_only, .m-institutional, .m-unsourced { color: var(--faint); }

  .err { background: #2a1618; border: 1px solid #4a2529; color: #f0b7b3;
         padding: 14px 18px; border-radius: 8px; margin: 20px 0; font-size: 14px; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 60px; }

  @media (max-width: 900px) {
    .briefs, .args, .bench { grid-template-columns: 1fr; }
    h1 { font-size: 34px; } .label { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Veritas<span class="ai">AI</span></h1>
    <div class="tag">Every claim deserves a trial.</div>
  </header>

  <form id="f">
    <input type="text" id="claim" autocomplete="off" spellcheck="false"
           placeholder="Enter a claim to put on trial…">
    <button id="go" type="submit">Convene</button>
  </form>

  <div class="examples" id="examples"></div>

  <div class="bench" id="bench"></div>
  <div id="err" class="err hidden"></div>

  <div id="out"></div>

  <footer>5 models · 3 adversarial roles · 1 verdict &nbsp;·&nbsp; ReverieHacks 2026</footer>
</div>

<script>
const EXAMPLES = [
  "The Great Wall of China is visible from space",
  "Social media causes depression in teenagers",
  "Goldfish have a three-second memory",
  "Nuclear power is more dangerous than coal",
  "We only use 10% of our brains",
];
const ROLE_ORDER = ["grounding","decomposer","prosecution","expert","defense","judge","citations"];
const CITE_MARK = {
  verified:"✓", partial:"~", unverified:"✗", unchecked:"?",
  journal_only:"·", institutional:"·", unsourced:"·"
};
const CITE_ORDER = ["unverified","partial","verified","unchecked","journal_only","institutional","unsourced"];
const VERDICT_COLOR = {
  "TRUE":"#4caf7d","MOSTLY TRUE":"#7fb98a","MIXED":"#c9a227",
  "MOSTLY FALSE":"#d9764f","FALSE":"#e0574f"
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let roster = [];

EXAMPLES.forEach(e => {
  const c = document.createElement("span");
  c.className = "chip"; c.textContent = e;
  c.onclick = () => { $("claim").value = e; $("f").requestSubmit(); };
  $("examples").appendChild(c);
});

function drawBench(states = {}) {
  $("bench").innerHTML = roster.map(r => `
    <div class="seat" data-state="${states[r.role] || "pending"}">
      <div class="who">${esc(r.label)}</div>
      <div class="model">${esc(r.model)}</div>
      <div class="state">${states[r.role] || "waiting"}</div>
    </div>`).join("");
}

fetch("/api/roster").then(r => r.json()).then(d => {
  if (d.error) { showErr(d.error); return; }
  roster = d.roster; drawBench();
}).catch(e => showErr(e.message));

function showErr(msg) { $("err").textContent = msg; $("err").classList.remove("hidden"); }
function clearErr() { $("err").classList.add("hidden"); }

$("f").onsubmit = ev => {
  ev.preventDefault();
  const claim = $("claim").value.trim();
  if (!claim) return;
  clearErr(); $("out").innerHTML = "";
  $("go").disabled = true; $("go").textContent = "In session…";

  const states = {}; ROLE_ORDER.forEach(r => states[r] = "pending");
  drawBench(states);

  const es = new EventSource("/api/try?claim=" + encodeURIComponent(claim));
  es.addEventListener("progress", e => {
    const d = JSON.parse(e.data); states[d.role] = d.state; drawBench(states);
  });
  es.addEventListener("error", e => {
    let msg = "connection to the courtroom was lost";
    try { msg = JSON.parse(e.data).message; } catch (_) {}
    showErr(msg); es.close(); reset();
  });
  es.addEventListener("verdict", e => {
    render(JSON.parse(e.data)); es.close(); reset();
  });
  es.onerror = () => { if (es.readyState === 2) { reset(); } };
};

function reset() { $("go").disabled = false; $("go").textContent = "Convene"; }

function list(items, cls = "") {
  if (!items || !items.length) return "";
  return `<ul class="${cls}">` + items.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>";
}

function evidence(items) {
  const bars = { strong:"▰▰▰", moderate:"▰▰▱", weak:"▰▱▱" };
  if (!items || !items.length) return `<div class="src">No evidence filed.</div>`;
  return "<ul>" + items.map(e =>
    `<li><span class="str">${bars[e.strength] || "▰▰▱"}</span>${esc(e.point)}
     <div class="src">${esc(e.source)}</div></li>`).join("") + "</ul>";
}

function advocate(p, cls, title, role, side) {
  if (!p) return `<div class="brief ${cls}"><h3>${title}</h3>
    <div class="role">${role}</div><p class="src">Failed to appear.</p></div>`;
  return `<div class="brief ${cls}">
    <h3>${title}</h3><div class="role">${role}</div>
    <div class="conf">${p.confidence}<small>confidence claim is ${side}</small></div>
    ${p.headline ? `<div class="headline">${esc(p.headline)}</div>` : ""}
    <div class="sub">Evidence</div>${evidence(p.evidence)}
    ${p.fallacies?.length ? `<div class="sub">Flaws alleged in the other side</div>${list(p.fallacies)}` : ""}
    ${p.concessions?.length ? `<div class="sub">Concedes</div>${list(p.concessions)}` : ""}
  </div>`;
}

function grounding(g) {
  if (!g) return "";
  const parts = [];
  if (g.papers?.length) {
    parts.push(`<div class="eyebrow">Peer-reviewed literature · CrossRef</div>` +
      g.papers.map(p => `<div class="ev">
        <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="meta">${esc([p.authors, p.year && "(" + p.year + ")", p.journal].filter(Boolean).join(" · "))}${
          p.citations ? " · cited by " + p.citations : ""}</div></div>`).join(""));
  }
  if (g.encyclopedia?.length) {
    parts.push(`<div class="eyebrow">Encyclopedic · Wikipedia</div>` +
      g.encyclopedia.map(w => `<div class="ev">
        <a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a>
        <div class="meta">${esc(w.snippet)}</div></div>`).join(""));
  }
  if (g.web?.length) {
    parts.push(`<div class="eyebrow">Current web coverage · DuckDuckGo</div>` +
      g.web.map(w => `<div class="ev">
        <a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a>
        ${w.snippet ? `<div class="meta">${esc(w.snippet)}</div>` : ""}</div>`).join(""));
  }
  if (!parts.length) return "";
  const c = g.counts || {};
  return `<div class="section-title">Evidence retrieved before the briefs
      <span style="text-transform:none;letter-spacing:0">
      (${c.papers || 0} papers · ${c.encyclopedia || 0} encyclopedia · ${c.web || 0} web)</span></div>
    <div class="docket">${parts.join("")}</div>`;
}

function audit(rep) {
  if (!rep || !rep.checks?.length) return "";
  const checks = [...rep.checks].sort(
    (a, b) => CITE_ORDER.indexOf(a.status) - CITE_ORDER.indexOf(b.status));
  const flagged = rep.flagged || 0, checked = rep.checked || 0, unchecked = rep.unchecked || 0;

  let head, cls;
  if (flagged) {
    head = `${flagged} of ${checked} checkable citations could not be found in CrossRef — treat those as unsupported`;
    cls = "dirty";
  } else if (unchecked) {
    head = `${unchecked} citation${unchecked > 1 ? "s" : ""} could not be checked (CrossRef unreachable)`;
    cls = "partial";
  } else if (checked) {
    head = `All ${checked} checkable citations matched a real record`;
    cls = "clean";
  } else {
    head = "No specific works were cited, so nothing was checkable";
    cls = "";
  }

  const rows = checks.map(c => `<div class="cite">
      <span class="mark m-${c.status}">${CITE_MARK[c.status] || "·"}</span>
      <span class="who">${esc(c.party.slice(0, 4))}</span>
      <span class="body">${esc(c.source)}
        <div class="det">${c.doi
          ? `→ ${esc(c.matched_title)} · <a href="https://doi.org/${esc(c.doi)}" target="_blank" rel="noopener">doi:${esc(c.doi)}</a>`
          : esc(c.detail)}</div>
      </span></div>`).join("");

  return `<div class="section-title">Citation audit</div>
    <div class="audit ${cls}"><h4>${esc(head)}</h4>${rows}</div>`;
}

function render(t) {
  const v = t.verdict || {}, b = v._briefs || {}, d = b.docket || {};
  const color = VERDICT_COLOR[v.verdict] || "#c9a227";

  const expert = b.expert ? `<div class="brief exp">
      <h3>Expert Witness</h3><div class="role">called by the court · neutral</div>
      <div class="conf">${b.expert.certainty}<small>how settled this is among experts</small></div>
      ${b.expert.consensus ? `<div class="headline">${esc(b.expert.consensus)}</div>` : ""}
      <div class="sub">Key findings</div>
      ${b.expert.key_findings?.length ? "<ul>" + b.expert.key_findings.map(f =>
        `<li>${esc(f.finding)}<div class="src">${esc(f.source)} · ${esc(f.year)}</div></li>`).join("") + "</ul>"
        : `<div class="src">None filed.</div>`}
      ${b.expert.open_questions?.length ? `<div class="sub">Open questions</div>${list(b.expert.open_questions)}` : ""}
      ${b.expert.common_misreadings?.length ? `<div class="sub">Commonly misread as</div>${list(b.expert.common_misreadings)}` : ""}
    </div>`
    : `<div class="brief exp"><h3>Expert Witness</h3><div class="role">neutral</div>
       <p class="src">Failed to appear.</p></div>`;

  $("out").innerHTML = `
    <div class="verdict">
      <div class="label" style="color:${color}">${esc(v.verdict)}</div>
      <div class="meter"><i style="width:${v.truth_score}%;background:${color}"></i></div>
      <div class="score-row">
        <span>truth score <b style="color:${color}">${v.truth_score}</b>/100</span>
        <span>judicial confidence: <b>${esc(v.confidence)}</b> · ruled in ${t.total_s}s</span>
      </div>
      ${v.reasoning ? `<div class="reason">${esc(v.reasoning)}</div>` : ""}
      <div class="args">
        <div class="arg for"><h4>Strongest argument for</h4>${esc(v.strongest_for) || "—"}</div>
        <div class="arg agst"><h4>Strongest argument against</h4>${esc(v.strongest_against) || "—"}</div>
      </div>
    </div>

    ${v.nuances?.length ? `<div class="section-title">Nuances the verdict rests on</div>
      <div class="docket">${list(v.nuances, "nuance")}</div>` : ""}

    <div class="section-title">The briefs</div>
    <div class="briefs">
      ${advocate(b.prosecution, "pro", "The Prosecution", "arguing the claim is false", "false")}
      ${expert}
      ${advocate(b.defense, "def", "The Defense", "arguing the claim is true", "true")}
    </div>

    <div class="section-title">The docket</div>
    <div class="docket">
      <div class="meta">domain: ${esc(d.domain)} &nbsp;·&nbsp; type: ${esc(d.claim_type)}</div>
      ${list((d.sub_claims || []).map(s => s.text))}
      ${d.ambiguities?.length ? `<div class="sub">Contested terms</div>${list(d.ambiguities)}` : ""}
    </div>

    ${audit(v._citations)}

    ${grounding(v._grounding)}

    ${v.recommended_reading?.length ? `<div class="section-title">Recommended reading</div>
      <div class="docket">${list(v.recommended_reading)}</div>` : ""}

    <div class="section-title">Trial record</div>
    <table class="record">
      <tr><th>node</th><th>provider</th><th>model</th><th>time</th><th>repairs</th><th>status</th></tr>
      ${t.nodes.map(n => `<tr>
        <td>${esc(n.role)}</td><td>${esc(n.provider)}</td><td>${esc(n.model)}</td>
        <td>${n.latency_s}s</td><td>${n.repairs}</td>
        <td class="${n.ok ? "ok" : "bad"}">${n.ok ? "ok" : esc(n.error)}</td></tr>`).join("")}
    </table>`;
}
</script>
</body>
</html>
